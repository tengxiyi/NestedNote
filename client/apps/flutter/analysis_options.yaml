include: package:flutter_lints/flutter.yaml

# 团队额外规则（对应《工程铁律》F 组）。
# 说明：这里只放"能由分析器表达"的约束；分层约束（Flutter 不得碰 SQLite）
# 由 scripts/check-rules.ps1 在仓库层面检查。
linter:
  rules:
    # F2：警告即问题，禁止用 ignore 掩盖
    always_declare_return_types: true
    avoid_print: true            # 日志必须走 logging，禁止 print
    prefer_const_constructors: true
    prefer_const_declarations: true
    prefer_final_locals: true
    unawaited_futures: true      # 未 await 的 Future 是静默 bug 的常见来源
    use_build_context_synchronously: true
    # F1/F4：资源释放与副作用
    cancel_subscriptions: true
    close_sinks: true
    # U3（Unicode 处理）没有对应的内置 lint 规则：
    # 字素簇级别的处理（光标移动、字数统计）无法靠静态检查保证，
    # 只能靠测试覆盖，因此这里不列规则，改由 Widget 测试兜底。

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # 以下问题在 CI 中视为错误（`flutter analyze` 必须 0 error / 0 warning）
    avoid_print: error
    unawaited_futures: error
    unused_import: error
    dead_code: error
  exclude:
    # ---- 生成代码（由 codegen 产出，不入库）----
    - "lib/src/rust/**"      # flutter_rust_bridge 生成的 Dart 绑定
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    # ---- 平台工程（由 flutter create 产出，我们只改极少数文件）----
    - android/**
    - ios/**
    - windows/**
    - macos/**
    # ---- 第三方构建工具（vendored，不由我们维护）----
    # rust_builder 是 Cargokit 的构建插件：它负责把 ../rust 编译并打包进应用，
    # 不含任何 Dart 业务代码。其 cargokit/ 子目录是上游 vendored 代码，
    # 在两个发布版本之间可能自相矛盾（实测有 74 个分析器报错）。
    # 我们对它的正确性不负责，也不应在它上面消耗"0 warning"门禁。
    - "rust_builder/**"
    - "build/**"
