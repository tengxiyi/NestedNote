name: nestednote
description: "拾光笔记 / NestedNote —— 本地优先的跨平台笔记应用"
# 与三处 Cargo.toml 的声明保持一致（铁律：同一事实只有一个来源，这里是四处同值）
license: AGPL-3.0-or-later
publish_to: "none"

# 版本号：<应用版本>+<构建号>
# 与 Rust 侧无关：Rust 内核版本由 client/Cargo.toml 的 workspace.package.version 决定。
version: 0.1.0+1

environment:
  # Dart SDK 由 Flutter SDK 自带。Flutter 3.47.6 携带 Dart 3.13.5。
  # 下限与 flutter_rust_bridge 2.13 的要求（>=3.9.2）保持一致。
  sdk: ">=3.9.2 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Rust 内核的本地构建与加载（Cargokit）。它把 ../rust 编译成平台库并随应用打包，
  # 因此 `flutter run` 会自动带上 Rust 产物，无需手工复制 dll。
  #
  # 注意包名用下划线：Dart 包名不允许连字符，而 Rust crate 名是 `nested-app`。
  # 两者的差异由 rust_builder/pubspec.yaml 的 `name:` 桥接（它只负责构建，不含 Dart 代码）。
  nested_app:
    path: rust_builder

  # Rust 内核绑定（FFI 桥接的 Dart 侧）。
  # 注意：命令行代码生成器 `flutter_rust_bridge_codegen` 是 **Rust 的 cargo 子命令**，
  # 不是 Dart 包，因此它不出现在这里（见 README「生成 Flutter 平台工程」）。
  flutter_rust_bridge: ^2.13.0

  # 状态管理（技术文档 §27：状态分层 UI → Feature → Rust Repository）
  flutter_riverpod: ^3.4.3

  # 应用数据目录（数据库与附件存放位置）
  path_provider: ^2.1.6

  # 日志（铁律 E4：Release 默认 INFO）
  logging: ^1.3.0
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # 应用显示名走本地化资源，禁止硬编码到 Widget（铁律 F8）
  # assets:
  #   - assets/
