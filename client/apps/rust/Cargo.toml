[package]
name = "nested_app"
description = "Flutter ↔ Rust 的 FFI 桥接层（由 flutter_rust_bridge 生成绑定，本 crate 提供业务入口）"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
# flutter_rust_bridge 需要 cdylib / staticlib 产物
crate-type = ["cdylib", "staticlib", "lib"]

[dependencies]
nested-core.workspace = true
nested-model.workspace = true
protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true
# 与 codegen 版本严格对应：版本不一致会导致生成的桥接代码编译失败
flutter_rust_bridge = "=2.13.0"

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
