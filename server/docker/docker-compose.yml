# 开发用基础设施：PostgreSQL + MinIO（S3 兼容对象存储）
#
# 用法：
#   docker compose -f server/docker/docker-compose.yml up -d
#   docker compose -f server/docker/docker-compose.yml down
#
# 注意：
#   - 这里的口令**仅用于本地开发**，不得用于任何共享或生产环境（铁律 S1/S12）。
#   - 镜像使用固定 tag，避免"今天能跑明天不能跑"（铁律 B4：构建可复现）。

name: nested-dev-infra

services:
  postgres:
    image: postgres:16.4-alpine
    container_name: nested-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nested
      POSTGRES_PASSWORD: nested-dev-only
      POSTGRES_DB: nested
      # 中文排序与大小写行为保持一致
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - nested-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nested -d nested"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: nested-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nested-dev
      MINIO_ROOT_PASSWORD: nested-dev-only
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - nested-minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 一次性作业：创建附件存储桶（键为内容哈希，见 server-storage/src/s3.rs）
  minio-init:
    image: minio/mc:RELEASE.2024-08-17T11-33-50Z
    container_name: nested-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 nested-dev nested-dev-only &&
      mc mb --ignore-existing local/nested-attachments &&
      echo 'bucket nested-attachments ready'
      "

volumes:
  nested-postgres-data:
  nested-minio-data:
